<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Iron Log">
<meta name="theme-color" content="#f6f3ec">
<title>Iron Log</title>
<style>
/* Big, high-contrast, one-thumb. Light by default (gym lighting), dark on request. Sizes are rem so the
   Text size setting scales everything. Base = 20px. */
:root{
  --bg:#f6f3ec;--card:#ffffff;--line:#c9c3b4;--txt:#111111;--mut:#454545;
  --pri:#0b6b4b;--pri-t:#ffffff;--acc:#8a5a00;--acc-bg:#fff2d6;--ok-bg:#dff3e8;--warn:#b3261e;--shadow:0 1px 3px rgba(0,0,0,.15);
}
[data-theme="dark"]{
  --bg:#101010;--card:#1c1c1c;--line:#4a4a4a;--txt:#ffffff;--mut:#d0d0d0;
  --pri:#47d6a0;--pri-t:#04281d;--acc:#ffd166;--acc-bg:#3a2e08;--ok-bg:#12372a;--warn:#ff8a80;--shadow:none;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html{font-size:20px;}
body{background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-weight:500;line-height:1.35;min-height:100dvh;display:flex;flex-direction:column;}
header.top{display:flex;justify-content:space-between;align-items:center;padding:calc(.6rem + env(safe-area-inset-top)) 1rem .5rem;}
header.top h1{font-size:1.5rem;font-weight:800;letter-spacing:.02em;}
header.top .sub{font-size:.8rem;color:var(--mut);}
#gear{min-height:48px;min-width:48px;border:2px solid var(--line);background:var(--card);color:var(--txt);border-radius:12px;font-size:.8rem;font-weight:700;padding:0 .7rem;}
main{flex:1;padding:.4rem 1rem 7rem;max-width:640px;width:100%;margin:0 auto;}
.pane{display:none;}.pane.active{display:block;}
h2{font-size:1.25rem;font-weight:800;margin:1rem 0 .5rem;}
.card{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:1rem;margin-bottom:.8rem;box-shadow:var(--shadow);}
.muted{color:var(--mut);}.small{font-size:.8rem;}
.big{font-size:1.6rem;font-weight:800;line-height:1.15;}
button{font-family:inherit;font-weight:800;cursor:pointer;}
.btn{display:block;width:100%;min-height:68px;border:none;border-radius:16px;font-size:1.15rem;padding:.7rem 1rem;background:var(--pri);color:var(--pri-t);}
.btn:active{transform:scale(.98);}
.btn:disabled{opacity:.4;}
.pin{position:sticky;bottom:calc(76px + env(safe-area-inset-bottom));z-index:10;box-shadow:0 0 0 .5rem var(--bg);}
.btn.ghost{background:var(--card);color:var(--txt);border:2px solid var(--line);}
.btn.sm{min-height:56px;font-size:1rem;}
.row{display:flex;gap:.6rem;}.row>*{flex:1;}
.chip{display:inline-block;background:var(--acc-bg);color:var(--txt);border-radius:999px;padding:.25rem .7rem;font-size:.85rem;font-weight:700;margin:.15rem .3rem .15rem 0;}
.chip.done{background:var(--ok-bg);}
.badge{display:inline-block;background:var(--pri);color:var(--pri-t);border-radius:8px;padding:.15rem .5rem;font-size:.8rem;font-weight:800;}
/* tabs */
nav#tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:2px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:20;}
nav#tabs button{flex:1;min-height:64px;border:none;background:none;color:var(--mut);font-size:.72rem;font-weight:800;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;}
nav#tabs button .ic{font-size:1.4rem;line-height:1;}
nav#tabs button.active{color:var(--pri);box-shadow:inset 0 3px 0 var(--pri);}
/* progress */
.pbar{height:12px;background:var(--line);border-radius:6px;overflow:hidden;margin:.4rem 0 .8rem;}
.pbar>i{display:block;height:100%;background:var(--pri);}
/* steppers */
.stepper{flex:1;text-align:center;}
.stepper label{display:block;font-size:.85rem;font-weight:800;color:var(--mut);margin-bottom:.3rem;}
.stepper .ctl{display:flex;align-items:center;gap:.4rem;}
.stepper button{width:64px;height:64px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--txt);font-size:1.7rem;flex-shrink:0;}
.stepper button:active{background:var(--line);}
.stepper input{width:100%;min-width:0;height:64px;text-align:center;font-size:2rem;font-weight:800;border:2px solid var(--line);border-radius:14px;background:var(--card);color:var(--txt);font-family:inherit;}
.stepper input:focus{outline:3px solid var(--pri);}
.field{width:100%;min-height:60px;font-size:1.1rem;font-weight:700;border:2px solid var(--line);border-radius:12px;padding:.5rem .8rem;background:var(--card);color:var(--txt);font-family:inherit;}
.lbl{display:block;font-size:.85rem;font-weight:800;color:var(--mut);margin:.7rem 0 .25rem;}
/* rest timer */
.rest{background:var(--acc-bg);border:2px solid var(--acc);border-radius:16px;padding:.5rem 1rem;margin:.5rem 0;display:flex;align-items:center;justify-content:space-between;}
.rest .t{font-size:2.2rem;font-weight:800;line-height:1.05;}
details summary{min-height:48px;display:flex;align-items:center;font-weight:800;color:var(--pri);cursor:pointer;}
details p{margin:.3rem 0 .6rem;font-size:.95rem;}
.setrow{display:flex;align-items:center;justify-content:space-between;padding:.55rem 0;border-bottom:1px solid var(--line);font-size:1.05rem;font-weight:700;}
.setrow:last-child{border-bottom:none;}
.hint{background:var(--acc-bg);border-radius:12px;padding:.6rem .8rem;margin:.5rem 0;font-size:.9rem;font-weight:700;}
.seg{display:flex;border:2px solid var(--line);border-radius:12px;overflow:hidden;}
.seg button{flex:1;min-height:52px;border:none;background:var(--card);color:var(--txt);font-size:1rem;}
.seg button.on{background:var(--pri);color:var(--pri-t);}
.timer{font-size:4.5rem;font-weight:800;text-align:center;line-height:1;margin:.5rem 0;}
.hcard{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:.8rem 1rem;margin-bottom:.6rem;}
.hcard .t{font-weight:800;font-size:1.05rem;display:flex;justify-content:space-between;gap:.5rem;}
.del{border:2px solid var(--line);background:var(--card);color:var(--warn);border-radius:10px;min-height:44px;padding:0 .8rem;font-size:.85rem;}
.stat{flex:1;text-align:center;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:.6rem .3rem;}
.stat b{display:block;font-size:1.7rem;font-weight:800;color:var(--pri);}
.stat span{font-size:.75rem;font-weight:800;color:var(--mut);}
#toast{position:fixed;left:50%;top:5rem;transform:translate(-50%,-300%);background:var(--txt);color:var(--bg);padding:.8rem 1.4rem;border-radius:14px;font-size:1.05rem;font-weight:800;z-index:50;transition:transform .25s;max-width:90vw;text-align:center;}
#toast.show{transform:translate(-50%,0);}
#sheetbg{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;z-index:40;}
#sheet{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-radius:20px 20px 0 0;padding:1rem 1rem calc(1.2rem + env(safe-area-inset-bottom));z-index:41;display:none;max-width:640px;margin:0 auto;}
.progbar{display:flex;justify-content:space-between;font-size:.9rem;font-weight:800;color:var(--mut);}
a.link{color:var(--pri);font-weight:800;}
</style>
</head>
<body>
<header class="top">
  <div><h1>Iron Log</h1><div class="sub" id="hdate"></div></div>
  <button id="gear" onclick="openSheet()" aria-label="Settings: text size and theme">Aa ⚙</button>
</header>
<main>
  <section id="pane-workout" class="pane active"></section>
  <section id="pane-stretch" class="pane"></section>
  <section id="pane-walk" class="pane"></section>
  <section id="pane-body" class="pane"></section>
  <section id="pane-history" class="pane"></section>
</main>
<nav id="tabs">
  <button class="active" data-p="workout" onclick="showPane('workout')"><span class="ic">🏋️</span>Workout</button>
  <button data-p="stretch" onclick="showPane('stretch')"><span class="ic">🧘</span>Stretch</button>
  <button data-p="walk" onclick="showPane('walk')"><span class="ic">🚶</span>Walk</button>
  <button data-p="body" onclick="showPane('body')"><span class="ic">⚖️</span>Body</button>
  <button data-p="history" onclick="showPane('history')"><span class="ic">📈</span>History</button>
</nav>
<div id="sheetbg" onclick="closeSheet()"></div>
<div id="sheet" role="dialog" aria-label="Settings">
  <h2 style="margin-top:0">Display</h2>
  <span class="lbl">Theme</span>
  <div class="seg" id="seg-theme"><button data-v="light" onclick="setTheme('light')">Light</button><button data-v="dark" onclick="setTheme('dark')">Dark</button></div>
  <span class="lbl">Text size</span>
  <div class="seg" id="seg-size"><button data-v="1" onclick="setSize(1)">Big</button><button data-v="1.15" onclick="setSize(1.15)">Bigger</button><button data-v="1.3" onclick="setSize(1.3)">Biggest</button></div>
  <button class="btn ghost sm" style="margin-top:1rem" onclick="closeSheet()">Done</button>
</div>
<div id="toast"></div>

<script>
// ───────── storage (same keys as the original Iron Log, so all history carries over) ─────────
const LS={get:k=>{try{return JSON.parse(localStorage.getItem(k)||'null');}catch{return null;}},set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));}catch{}}};
let gymLog=LS.get('il4_gym')||[], walkLog=LS.get('il4_walk')||[], strLog=LS.get('il4_str')||[], bodyLog=LS.get('il4_body')||[];
const BODY_TARGETS={baselineBF:36.1,baselineLb:228.6,milestoneBF:28,milestoneLb:203,goalBF:22,goalLb:187};
if(!bodyLog.length){bodyLog=[{id:1,ts:new Date('2026-09-02T12:00:00').getTime(),date:'Wed, Sep 2, 2026',weightLb:228.6,bodyFatPct:36.1,waistIn:null,baseline:true}];LS.set('il4_body',bodyLog);}
const $=id=>document.getElementById(id);
const fmtDate=d=>d.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric',year:'numeric'});
const isToday=ts=>new Date(ts).toDateString()===new Date().toDateString();
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('show'),2200);}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

// ───────── display settings ─────────
function applyDisplay(){
  const th=LS.get('il4v2_theme')||'light', sz=LS.get('il4v2_size')||1;
  document.documentElement.dataset.theme=th;
  document.documentElement.style.fontSize=(20*sz)+'px';
  document.querySelector('meta[name=theme-color]').content=th==='dark'?'#101010':'#f6f3ec';
  document.querySelectorAll('#seg-theme button').forEach(b=>b.classList.toggle('on',b.dataset.v===th));
  document.querySelectorAll('#seg-size button').forEach(b=>b.classList.toggle('on',Number(b.dataset.v)===sz));
}
function setTheme(v){LS.set('il4v2_theme',v);applyDisplay();}
function setSize(v){LS.set('il4v2_size',v);applyDisplay();}
function openSheet(){$('sheetbg').style.display='block';$('sheet').style.display='block';}
function closeSheet(){$('sheetbg').style.display='none';$('sheet').style.display='none';}

// ───────── program: two full-body workouts, rotating (2–3 days/week) ─────────
// `n` is the name logged to history (matches the original app's machine names); `alias` are older names whose
// history should still feed "last time" and the +5 lb suggestion.
const WORKOUTS={
  A:{name:'Workout A',warm:'5 minutes of easy walking or bike first.',exs:[
    {n:'Leg Press',sets:3,lo:10,hi:12,alias:[],how:'Feet shoulder-width, middle of the plate. Lower until knees are bent about 90°, push through your heels. Do not lock your knees at the top.'},
    {n:'Chest Press',sets:3,lo:10,hi:12,alias:['Chest Press Machine'],how:'Handles at mid-chest. Press straight out without locking your elbows, and take 3 seconds to come back.'},
    {n:'Seated Row',sets:3,lo:10,hi:12,alias:['Seated Row Machine'],how:'Pull the handles to your belly button, squeezing your shoulder blades together. Keep your back straight.'},
    {n:'Seated Leg Curl',sets:2,lo:12,hi:15,alias:['Lying / Seated Leg Curl'],how:'Curl the pad down and back, hold 1 second, and lower slowly. Do not let the weights drop.'},
    {n:'Triceps Extension',sets:2,lo:12,hi:15,alias:['Triceps Pushdown','Triceps Press'],how:'Elbows pinned to your sides. Push down until your arms are straight, then let it back up slowly.'},
    {n:'Abdominal Crunch',sets:2,lo:12,hi:15,alias:[],how:'Hold the handles and curl your body forward, breathing out. Use your stomach, not your arms.'},
  ]},
  B:{name:'Workout B',warm:'5 minutes of easy walking or bike first.',exs:[
    {n:'Leg Extension',sets:3,lo:12,hi:15,alias:['Leg Extension (lighter)'],how:'Back against the pad. Straighten your legs, squeeze 1 second at the top, and lower slowly.'},
    {n:'Shoulder Press',sets:3,lo:10,hi:12,alias:['Shoulder Press Machine'],how:'Push the handles straight up. Do not shrug your shoulders. Stop just short of locking your elbows.'},
    {n:'Lat Pulldown',sets:3,lo:10,hi:12,alias:[],how:'Pull the bar down to your upper chest, never behind your neck. Lean back slightly and squeeze your shoulder blades.'},
    {n:'Calf Extension',sets:2,lo:15,hi:20,alias:['Calf Raise (machine)'],how:'Go all the way down for a stretch, then rise all the way up on your toes and pause at the top.'},
    {n:'Biceps Curl',sets:2,lo:12,hi:15,alias:['Biceps Curl (machine/cable)','Dependent Curl'],how:'Full range of motion. Keep tension on the muscle and do not let the weights rest between reps.'},
    {n:'Back Extension',sets:2,lo:12,hi:15,alias:[],how:'Lean back slowly with control and stop when your body is in a straight line. Do not arch past that.'},
  ]},
};
const REST_SECS=90;

// ───────── workout state ─────────
let wk=null, exIdx=0, view='home', inp={w:0,r:0}, restLeft=0, restInt=null, extra=false;
function namesOf(ex){return [ex.n,...ex.alias];}
function loggedToday(ex){let s=[];gymLog.filter(g=>g.machine===ex.n&&isToday(g.ts)).forEach(g=>s=s.concat(g.sets));return s;}
function lastSession(ex){ // most recent entry (any alias) that is not today
  const names=namesOf(ex);
  return gymLog.find(g=>names.includes(g.machine)&&!isToday(g.ts)&&g.sets.length)||null;
}
function suggestion(ex){
  const last=lastSession(ex);
  if(!last)return {w:0,r:ex.lo,hit:false,last:null};
  const hit=last.sets.every(s=>s.reps>=ex.hi);
  const lw=last.sets[last.sets.length-1].weight;
  return {w:hit?lw+5:lw,r:hit?ex.lo:Math.max(ex.lo,Math.min(ex.hi,last.sets[last.sets.length-1].reps)),hit,last};
}
function classify(day){ // which workout does a day's history look like?
  const names=new Set(gymLog.filter(g=>new Date(g.ts).toDateString()===day).map(g=>g.machine));
  let a=0,b=0;
  WORKOUTS.A.exs.forEach(e=>namesOf(e).some(n=>names.has(n))&&a++);
  WORKOUTS.B.exs.forEach(e=>namesOf(e).some(n=>names.has(n))&&b++);
  return a===b?null:(a>b?'A':'B');
}
function pickWorkout(){
  const todays=classify(new Date().toDateString());
  if(todays&&gymLog.some(g=>isToday(g.ts)))return todays;
  const lastDay=gymLog.find(g=>!isToday(g.ts));
  if(lastDay){const c=classify(new Date(lastDay.ts).toDateString());if(c)return c==='A'?'B':'A';}
  return 'A';
}
function firstOpenIndex(){
  const exs=WORKOUTS[wk].exs;
  const i=exs.findIndex(e=>loggedToday(e).length<e.sets);
  return i<0?exs.length:i;
}
function weekCount(){
  const n=new Date(),s=new Date(n);s.setDate(n.getDate()-n.getDay());s.setHours(0,0,0,0);
  return new Set(gymLog.filter(g=>g.ts>=s.getTime()).map(g=>new Date(g.ts).toDateString())).size;
}
async function keepAwake(){try{if('wakeLock' in navigator)await navigator.wakeLock.request('screen');}catch{}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&view==='exercise')keepAwake();});

function renderWorkout(){
  if(!wk)wk=pickWorkout();
  const el=$('pane-workout');
  if(view==='home')return el.innerHTML=homeHTML();
  if(view==='all')return el.innerHTML=allHTML();
  if(view==='done')return el.innerHTML=doneHTML();
  el.innerHTML=exerciseHTML();
}
function homeHTML(){
  const w=WORKOUTS[wk],open=firstOpenIndex(),started=gymLog.some(g=>isToday(g.ts)&&w.exs.some(e=>namesOf(e).includes(g.machine)));
  const total=w.exs.reduce((a,e)=>a+e.sets,0),done=w.exs.reduce((a,e)=>a+Math.min(loggedToday(e).length,e.sets),0);
  return `
  <div class="row" style="margin:.4rem 0 .8rem">
    <div class="stat"><b>${weekCount()}</b><span>WORKOUTS THIS WEEK</span></div>
    <div class="stat"><b>2–3</b><span>WEEKLY GOAL</span></div>
  </div>
  <div class="card">
    <div class="muted small" style="font-weight:800">${started?'IN PROGRESS':'UP NEXT'}</div>
    <div class="big">${w.name}</div>
    <div class="muted" style="margin:.2rem 0 .6rem">${w.exs.length} machines · about 40 minutes</div>
    ${started?`<div class="pbar"><i style="width:${Math.round(done/total*100)}%"></i></div><div class="small muted" style="margin-bottom:.6rem">${done} of ${total} sets done</div>`:''}
    <div class="seg" style="margin-bottom:.8rem"><button class="${wk==='A'?'on':''}" onclick="pickWk('A')">Workout A</button><button class="${wk==='B'?'on':''}" onclick="pickWk('B')">Workout B</button></div>
    <div class="small muted" style="margin-bottom:.8rem">🔥 ${w.warm}</div>
    <button class="btn" onclick="startWk()">${open>=w.exs.length?'REVIEW WORKOUT':started?'CONTINUE':'START WORKOUT'}</button>
    <button class="btn ghost sm" style="margin-top:.6rem" onclick="view='all';renderWorkout()">See all ${w.exs.length} machines</button>
  </div>
  <div class="card muted small">Not a gym day? Do the <b>Stretch</b> routine or a <b>Walk</b> instead. Two or three workouts a week is plenty. Come back whenever you are ready and it will pick the next one.</div>`;
}
function pickWk(x){wk=x;renderWorkout();}
function startWk(){exIdx=Math.min(firstOpenIndex(),WORKOUTS[wk].exs.length-1);view=firstOpenIndex()>=WORKOUTS[wk].exs.length?'done':'exercise';enterEx();}
function enterEx(){
  clearInterval(restInt);restLeft=0;extra=false;
  const ex=WORKOUTS[wk].exs[exIdx];
  if(ex){const sg=suggestion(ex),td=loggedToday(ex),lt=td[td.length-1];inp={w:lt?lt.weight:sg.w,r:lt?lt.reps:sg.r};}
  keepAwake();renderWorkout();window.scrollTo(0,0);
}
function allHTML(){
  const w=WORKOUTS[wk];
  return `<h2>${w.name}</h2>`+w.exs.map((e,i)=>{
    const n=Math.min(loggedToday(e).length,e.sets),ok=n>=e.sets;
    return `<button class="card" style="width:100%;text-align:left;color:inherit;display:flex;justify-content:space-between;align-items:center;gap:.5rem" onclick="exIdx=${i};view='exercise';enterEx()">
      <span><b style="font-size:1.1rem">${ok?'✓ ':''}${esc(e.n)}</b><br><span class="muted small">${e.sets} × ${e.lo}${e.lo===e.hi?'':'–'+e.hi}</span></span>
      <span class="chip ${ok?'done':''}">${n} of ${e.sets}</span></button>`;}).join('')+
    `<button class="btn ghost" onclick="view='home';renderWorkout()">← Back</button>`;
}
function exerciseHTML(){
  const w=WORKOUTS[wk],ex=w.exs[exIdx],td=loggedToday(ex),sg=suggestion(ex),n=td.length,complete=n>=ex.sets&&!extra;
  const range=ex.lo===ex.hi?ex.hi:`${ex.lo}–${ex.hi}`;
  const lastTxt=sg.last?sg.last.sets.map(s=>`${s.weight}×${s.reps}`).join(', '):null;
  return `
  <div class="progbar"><span>Exercise ${exIdx+1} of ${w.exs.length}</span><a class="link" href="#" onclick="view='all';renderWorkout();return false">All machines</a></div>
  <div class="pbar"><i style="width:${Math.round(exIdx/w.exs.length*100)}%"></i></div>
  <div class="card">
    <div class="big">${esc(ex.n)}</div>
    <div style="margin:.3rem 0"><span class="badge">${ex.sets} sets × ${range} reps</span></div>
    ${lastTxt?`<div class="muted" style="margin-top:.4rem">Last time: <b>${lastTxt}</b></div>`:'<div class="muted" style="margin-top:.4rem">First time on this machine. Start light.</div>'}
    ${sg.hit?`<div class="hint">⬆ You hit ${ex.hi} reps on every set last time. Try ${sg.w} lb today.</div>`:''}
    <details><summary>How to do it</summary><p>${esc(ex.how)}</p></details>
  </div>
  ${td.length?`<div style="margin:.2rem 0 .4rem">${td.map((s,i)=>`<span class="chip done">✓ Set ${i+1}: ${s.weight} × ${s.reps}</span>`).join('')}</div>`:''}
  ${restLeft>0?`<div class="rest" id="restbox"><div><div class="small" style="font-weight:800">REST</div><div class="t" id="resttime">${fmtT(restLeft)}</div></div><button class="btn ghost sm" style="width:auto;min-height:56px;padding:0 1.2rem" onclick="skipRest()">Skip</button></div>`:''}
  ${complete?`
    <div class="card" style="background:var(--ok-bg);text-align:center"><div class="big">✓ Done</div><div class="muted">${ex.n}: ${n} sets logged</div></div>
    <button class="btn pin" onclick="nextEx()">${exIdx+1<w.exs.length?'NEXT: '+esc(w.exs[exIdx+1].n)+' →':'FINISH WORKOUT'}</button>
    <button class="btn ghost sm" style="margin-top:.6rem" onclick="extra=true;renderWorkout()">+ One more set</button>`
  :setForm(ex,n)}
  <div class="row" style="margin-top:.8rem">
    <button class="btn ghost sm" ${exIdx===0?'disabled':''} onclick="exIdx--;enterEx()">← Back</button>
    <button class="btn ghost sm" onclick="nextEx()">Skip →</button>
  </div>
  ${n?`<button class="btn ghost sm" style="margin-top:.6rem;color:var(--warn)" onclick="undoSet()">Undo last set</button>`:''}`;
}
function setForm(ex,n){
  return `
  <div class="row" style="margin:.3rem 0">
    <div class="stepper"><label>WEIGHT (lb)</label><div class="ctl"><button onclick="bump('w',-5)" aria-label="minus 5 pounds">−</button><input id="iw" type="number" inputmode="decimal" value="${inp.w||''}" placeholder="0" onchange="inp.w=parseFloat(this.value)||0;chk()" oninput="inp.w=parseFloat(this.value)||0;chk()"><button onclick="bump('w',5)" aria-label="plus 5 pounds">+</button></div></div>
  </div>
  <div class="row" style="margin:.3rem 0 .7rem">
    <div class="stepper"><label>REPS</label><div class="ctl"><button onclick="bump('r',-1)" aria-label="minus 1 rep">−</button><input id="ir" type="number" inputmode="numeric" value="${inp.r||''}" placeholder="0" onchange="inp.r=parseInt(this.value)||0;chk()" oninput="inp.r=parseInt(this.value)||0;chk()"><button onclick="bump('r',1)" aria-label="plus 1 rep">+</button></div></div>
  </div>
  <button class="btn pin" id="logbtn" onclick="logSet()" ${inp.w>0&&inp.r>0?'':'disabled'}>${n>=ex.sets?'LOG EXTRA SET':'LOG SET '+(n+1)+' OF '+ex.sets}</button>`;
}
function bump(k,d){inp[k]=Math.max(0,Math.round(((inp[k]||0)+d)*10)/10);const i=$(k==='w'?'iw':'ir');if(i)i.value=inp[k]||'';chk();}
function chk(){const b=$('logbtn');if(b)b.disabled=!(inp.w>0&&inp.r>0);}
function logSet(){
  const ex=WORKOUTS[wk].exs[exIdx];if(!(inp.w>0&&inp.r>0))return;
  let e=gymLog.find(g=>g.machine===ex.n&&isToday(g.ts));
  if(e)e.sets.push({weight:inp.w,reps:inp.r});
  else gymLog.unshift({id:Date.now(),ts:Date.now(),date:fmtDate(new Date()),machine:ex.n,sets:[{weight:inp.w,reps:inp.r}]});
  LS.set('il4_gym',gymLog);
  const n=loggedToday(ex).length;
  if(extra){extra=false;toast('✓ Extra set logged');restLeft=0;renderWorkout();return;}
  if(n>=ex.sets){toast('✓ '+ex.n+' done');restLeft=0;}else{startRest();}
  renderWorkout();
}
function undoSet(){
  const ex=WORKOUTS[wk].exs[exIdx],e=gymLog.find(g=>g.machine===ex.n&&isToday(g.ts));
  if(!e)return;e.sets.pop();if(!e.sets.length)gymLog=gymLog.filter(g=>g!==e);
  LS.set('il4_gym',gymLog);clearInterval(restInt);restLeft=0;
  const td=loggedToday(ex),lt=td[td.length-1],sg=suggestion(ex);inp={w:lt?lt.weight:sg.w,r:lt?lt.reps:sg.r};
  renderWorkout();toast('Last set removed');
}
function fmtT(s){return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');}
function startRest(){
  clearInterval(restInt);restLeft=REST_SECS;
  restInt=setInterval(()=>{restLeft--;const t=$('resttime');if(restLeft<=0){clearInterval(restInt);restLeft=0;try{navigator.vibrate&&navigator.vibrate([200,100,200]);}catch{}renderWorkout();toast('Rest over: next set');}else if(t)t.textContent=fmtT(restLeft);},1000);
}
function skipRest(){clearInterval(restInt);restLeft=0;renderWorkout();}
function nextEx(){
  const w=WORKOUTS[wk];
  if(exIdx+1<w.exs.length){exIdx++;enterEx();}
  else{clearInterval(restInt);restLeft=0;view='done';renderWorkout();window.scrollTo(0,0);}
}
function doneHTML(){
  const w=WORKOUTS[wk];
  let sets=0,vol=0;w.exs.forEach(e=>loggedToday(e).forEach(s=>{sets++;vol+=s.weight*s.reps;}));
  return `
  <div class="card" style="text-align:center;background:var(--ok-bg)"><div class="big">💪 ${w.name} done</div><div style="margin-top:.4rem"><b>${sets}</b> sets · <b>${vol.toLocaleString()}</b> lb lifted</div></div>
  <button class="btn" onclick="showPane('walk')">🚶 Log post-lift cardio (10–15 min)</button>
  <button class="btn ghost" style="margin-top:.6rem" onclick="showPane('stretch')">🧘 Stretch now</button>
  <button class="btn ghost sm" style="margin-top:.6rem" onclick="view='home';wk=null;renderWorkout()">Back to start</button>`;
}

// ───────── stretch (same 10 stretches as before; full or quick) ─────────
const STRS=[
  {n:'Ankle Circles',s:60,a:'Joint warm-up',h:'30 sec each foot',d:'Sit in a chair. Lift one foot and draw slow circles with your toes, 10 each way. Switch feet. Ankle mobility is a big factor in balance and fall risk after 60.'},
  {n:'Cat-Cow',s:60,a:'Joint warm-up',h:'10 slow reps',d:'On hands and knees (or seated, hands on knees). Arch your back up toward the ceiling, then let it sag down. Move with your breath.'},
  {n:'Knee-to-Chest',s:90,a:'Hips & lower back',h:'30 sec each side',d:'Lie on your back. Pull one knee gently to your chest and hold, then switch. Releases lower back tightness from sleeping and sitting.'},
  {n:'Figure-4 Hip Stretch',s:120,a:'Hips & lower back',h:'60 sec each side',d:'Lie on your back. Cross your right ankle over your left knee. Pull your left thigh toward you until you feel a deep stretch in your right hip. Hold, then switch. Hip flexibility is tied to balance.'},
  {n:'Hip Flexor Stretch',s:90,a:'Hips & lower back',h:'45 sec each side',d:'Kneel on one knee next to a chair for balance. Tuck your pelvis slightly and shift forward until you feel a stretch in the front of the kneeling hip. Switch sides.'},
  {n:'Doorway Chest Opener',s:45,a:'Spine & posture',h:'45 sec',d:'Stand in a doorway with both forearms on the frame at 90°. Lean forward gently until you feel a stretch across your chest and shoulders.'},
  {n:'Seated Thoracic Rotation',s:60,a:'Spine & posture',h:'30 sec each side',d:'Sit upright, arms crossed over your chest. Rotate your upper body slowly to the right, hold 2 seconds, return, then go left.'},
  {n:'Seated Forward Fold',s:60,a:'Hamstrings & calves',h:'60 sec',d:'Sit on the floor with legs straight out. Reach toward your feet as far as is comfortable, even your shins is fine. Never force or bounce.'},
  {n:'Standing Calf Stretch',s:60,a:'Hamstrings & calves',h:'30 sec each side',d:'Face a wall, hands on it. Step one foot back, heel flat on the floor, and lean forward. Switch sides.'},
  {n:"Child's Pose",s:60,a:'Cool-down',h:'60 sec',d:'Kneel, sit back toward your heels, reach your arms forward, and let your back relax. Hold and breathe.'},
];
const QUICK=[2,3,4,5,9]; // Knee-to-Chest, Figure-4, Hip Flexor, Chest Opener, Child's Pose (~7 min)
let sr=null,srInt=null;
const mins=l=>Math.round(l.reduce((a,i)=>a+STRS[i].s,0)/60);
function renderStretch(){
  const el=$('pane-stretch');
  if(!sr){
    const full=STRS.map((_,i)=>i);
    el.innerHTML=`<h2>Stretch</h2>
    <div class="card muted">Easy, slow, and no pain. A timer runs for each stretch. Do it after lifting or on any rest day.</div>
    <button class="btn" onclick="startStr('full')">FULL ROUTINE · ${mins(full)} min · ${full.length} stretches</button>
    <button class="btn ghost" style="margin-top:.6rem" onclick="startStr('quick')">QUICK · ${mins(QUICK)} min · ${QUICK.length} key stretches</button>
    <h2>All stretches</h2>`+STRS.map(s=>`<div class="card"><b>${s.n}</b> <span class="chip">${s.h}</span><div class="muted small" style="margin-top:.3rem">${s.d}</div></div>`).join('');
    return;
  }
  if(sr.done){
    el.innerHTML=`<div class="card" style="text-align:center;background:var(--ok-bg)"><div class="big">🧘 Routine complete</div><div class="muted" style="margin-top:.3rem">Nice work. Logged.</div></div>
    <button class="btn" onclick="sr=null;renderStretch()">Back</button>`;return;
  }
  const s=STRS[sr.list[sr.pos]];
  const yt='https://www.youtube.com/results?search_query='+encodeURIComponent('how to do '+s.n+' stretch for seniors over 60');
  el.innerHTML=`
  <div class="progbar"><span>Stretch ${sr.pos+1} of ${sr.list.length}</span><span>${s.a}</span></div>
  <div class="pbar"><i style="width:${Math.round((sr.pos+(sr.total-sr.left)/sr.total)/sr.list.length*100)}%"></i></div>
  <div class="card" style="text-align:center">
    <div class="big">${s.n}</div>
    <div class="chip" style="margin-top:.4rem">${s.h}</div>
    <div class="timer" id="srtime">${fmtT(sr.left)}</div>
    <div class="row"><button class="btn" id="srgo" onclick="srToggle()">${sr.run?'PAUSE':(sr.left<sr.total?'RESUME':'START')}</button></div>
  </div>
  <div class="card">${s.d}<div style="margin-top:.5rem"><a class="link" href="${yt}" target="_blank" rel="noopener">▶ Watch how</a></div></div>
  <div class="row"><button class="btn ghost sm" ${sr.pos===0?'disabled':''} onclick="srMove(-1)">← Back</button><button class="btn ghost sm" onclick="srMove(1)">Next →</button></div>
  <button class="btn ghost sm" style="margin-top:.6rem" onclick="srQuit()">End routine</button>`;
}
function startStr(mode){const list=mode==='quick'?QUICK:STRS.map((_,i)=>i);sr={list,pos:0,left:STRS[list[0]].s,total:STRS[list[0]].s,run:false,done:false,mode};renderStretch();}
function srToggle(){
  if(sr.run){sr.run=false;clearInterval(srInt);renderStretch();return;}
  sr.run=true;renderStretch();
  srInt=setInterval(()=>{sr.left--;const t=$('srtime');if(t)t.textContent=fmtT(Math.max(0,sr.left));
    if(sr.left<=0){clearInterval(srInt);sr.run=false;try{navigator.vibrate&&navigator.vibrate([250,100,250]);}catch{}srMove(1,true);}},1000);
}
function srMove(d,auto){
  clearInterval(srInt);sr.run=false;
  const np=sr.pos+d;
  if(np>=sr.list.length){sr.done=true;strLog.unshift({id:Date.now(),ts:Date.now(),date:fmtDate(new Date()),mode:sr.mode});LS.set('il4_str',strLog);toast('Routine done');renderStretch();return;}
  if(np<0)return;
  sr.pos=np;sr.left=STRS[sr.list[np]].s;sr.total=sr.left;renderStretch();
  if(auto)toast('Next: '+STRS[sr.list[np]].n);
}
function srQuit(){clearInterval(srInt);sr=null;renderStretch();}

// ───────── walk / cardio ─────────
let selInt=5,cardioMin=12;
function renderWalk(){
  const btn=(v,cur,fn,label)=>`<button class="btn ${v===cur?'':'ghost'} sm" onclick="${fn}(${v})">${label}</button>`;
  $('pane-walk').innerHTML=`<h2>Walk</h2>
  <div class="card"><div class="big" style="font-size:1.25rem">Interval walk</div>
    <div class="muted" style="margin:.2rem 0 .6rem">3 minutes fast, 3 minutes easy. Goal: 5 rounds (30 min). Use your watch as the timer.</div>
    <span class="lbl" style="margin-top:0">ROUNDS DONE</span>
    <div class="row" style="flex-wrap:wrap">${[1,2,3,4,5].map(n=>btn(n,selInt,'setInt',n)).join('')}</div>
    <button class="btn" style="margin-top:.8rem" onclick="logWalk()">LOG WALK</button></div>
  <div class="card"><div class="big" style="font-size:1.25rem">Cardio after lifting</div>
    <div class="muted" style="margin:.2rem 0 .6rem">10–15 minutes at a brisk pace on the treadmill.</div>
    <span class="lbl" style="margin-top:0">MINUTES</span>
    <div class="row">${[10,12,15].map(n=>btn(n,cardioMin,'setMin',n)).join('')}</div>
    <button class="btn" style="margin-top:.8rem" onclick="logCardio()">LOG CARDIO</button></div>
  <h2>Recent</h2>`+(walkLog.length?walkLog.slice(0,8).map(walkCard).join(''):'<div class="muted">Nothing logged yet.</div>');
}
function setInt(n){selInt=n;renderWalk();}function setMin(n){cardioMin=n;renderWalk();}
function logWalk(){walkLog.unshift({id:Date.now(),ts:Date.now(),date:fmtDate(new Date()),kind:'japanese',intervals:selInt,minutes:selInt*6});LS.set('il4_walk',walkLog);renderWalk();toast('Walk logged');}
function logCardio(){walkLog.unshift({id:Date.now(),ts:Date.now(),date:fmtDate(new Date()),kind:'cardio',minutes:cardioMin});LS.set('il4_walk',walkLog);renderWalk();toast('Cardio logged');}
function walkCard(w){
  const t=w.kind==='cardio'?'Post-lift cardio':'Interval walk';
  const b=w.kind==='cardio'?`${w.minutes} min`:`${w.intervals} rounds`;
  return `<div class="hcard"><div class="t"><span>${t}</span><span class="chip">${b}</span></div><div class="muted small">${w.date}</div></div>`;
}

// ───────── body ─────────
function sparkline(data,color){
  if(data.length<2)return '<div class="muted small" style="padding:.6rem 0">Log two check-ins to see a trend.</div>';
  const w=280,h=60,pad=4,min=Math.min(...data),max=Math.max(...data),range=(max-min)||1;
  const pts=data.map((v,i)=>(pad+i*(w-2*pad)/(data.length-1)).toFixed(1)+','+(h-pad-((v-min)/range)*(h-2*pad)).toFixed(1)).join(' ');
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:${h}px;display:block" preserveAspectRatio="none"><polyline points="${pts}" fill="none" stroke="${color}" stroke-width="3"/></svg>`;
}
function bprog(label,cur,base,target){
  const pct=Math.max(0,Math.min(100,Math.round(((base-cur)/(base-target))*100)));
  return `<div style="margin-bottom:.8rem"><div class="progbar"><span>${label}</span><span>${pct}%</span></div><div class="pbar" style="margin:.3rem 0"><i style="width:${pct}%"></i></div><div class="progbar"><span>Now ${cur}%</span><span>Goal ${target}%</span></div></div>`;
}
function renderBody(){
  bodyLog.sort((a,b)=>b.ts-a.ts);const cur=bodyLog[0],chron=[...bodyLog].reverse();
  $('pane-body').innerHTML=`<h2>Body</h2>
  <div class="row" style="margin-bottom:.8rem">
    <div class="stat"><b>${cur.weightLb}</b><span>WEIGHT LB</span></div>
    <div class="stat"><b>${cur.bodyFatPct}%</b><span>BODY FAT</span></div>
    <div class="stat"><b>${Math.round(cur.weightLb*(1-cur.bodyFatPct/100))}</b><span>LEAN LB</span></div>
  </div>
  <div class="card">${bprog('Milestone: 28%',cur.bodyFatPct,BODY_TARGETS.baselineBF,BODY_TARGETS.milestoneBF)}${bprog('Goal: 22%',cur.bodyFatPct,BODY_TARGETS.baselineBF,BODY_TARGETS.goalBF)}</div>
  <div class="card"><span class="lbl" style="margin-top:0">WEIGHT (lb)</span>${sparkline(chron.map(e=>e.weightLb),'#0b6b4b')}
    <span class="lbl">BODY FAT %</span>${sparkline(chron.map(e=>e.bodyFatPct),'#b3261e')}</div>
  <h2>Log a check-in</h2>
  <div class="card">
    <span class="lbl" style="margin-top:0">DATE</span><input class="field" id="b-date" type="date" value="${new Date().toISOString().slice(0,10)}">
    <span class="lbl">WEIGHT (lb)</span><input class="field" id="b-w" type="number" inputmode="decimal" placeholder="228.6">
    <span class="lbl">BODY FAT %</span><input class="field" id="b-bf" type="number" inputmode="decimal" placeholder="36.1">
    <span class="lbl">WAIST (in), optional</span><input class="field" id="b-wa" type="number" inputmode="decimal" placeholder="42">
    <button class="btn" style="margin-top:1rem" onclick="saveBody()">SAVE CHECK-IN</button></div>
  <div class="card muted small">Judge progress on the trend, not any one day. Re-test body fat and waist about once a month.</div>
  <h2>History</h2>`+bodyLog.map(e=>`<div class="hcard"><div class="t"><span>${e.date}${e.baseline?' (start)':''}</span><button class="del" onclick="delBody(${e.id})">Delete</button></div><div style="margin-top:.3rem"><span class="chip">${e.weightLb} lb</span><span class="chip">${e.bodyFatPct}% fat</span>${e.waistIn?`<span class="chip">${e.waistIn} in waist</span>`:''}</div></div>`).join('');
}
function saveBody(){
  const w=parseFloat($('b-w').value),bf=parseFloat($('b-bf').value),wa=$('b-wa').value!==''?parseFloat($('b-wa').value):null,dv=$('b-date').value;
  if(!w||!bf){toast('Enter weight and body fat first');return;}
  const d=dv?new Date(dv+'T12:00:00'):new Date();
  bodyLog.push({id:Date.now(),ts:d.getTime(),date:fmtDate(d),weightLb:w,bodyFatPct:bf,waistIn:wa});
  LS.set('il4_body',bodyLog);renderBody();toast('Check-in saved');
}
function delBody(id){if(!confirm('Delete this check-in?'))return;bodyLog=bodyLog.filter(e=>e.id!==id);LS.set('il4_body',bodyLog);renderBody();}

// ───────── history ─────────
function renderHistory(){
  const g={};const add=(e,t)=>{(g[e.date]=g[e.date]||[]).push({...e,type:t,ts:e.ts});};
  gymLog.forEach(e=>add(e,'gym'));walkLog.forEach(e=>add(e,'walk'));strLog.forEach(e=>add(e,'stretch'));bodyLog.forEach(e=>add(e,'body'));
  const days=Object.entries(g).sort((a,b)=>Math.max(...b[1].map(x=>x.ts))-Math.max(...a[1].map(x=>x.ts)));
  $('pane-history').innerHTML=`<h2>History</h2>
  <div class="row" style="margin-bottom:.8rem"><div class="stat"><b>${new Set(gymLog.map(e=>new Date(e.ts).toDateString())).size}</b><span>GYM DAYS</span></div><div class="stat"><b>${strLog.length}</b><span>STRETCHES</span></div><div class="stat"><b>${walkLog.length}</b><span>WALKS</span></div></div>`+
  (days.length?days.map(([date,es])=>`<h2 style="font-size:1rem;color:var(--mut)">${date}</h2>`+es.map(e=>{
    if(e.type==='gym')return `<div class="hcard"><div class="t"><span>${esc(e.machine)}</span><button class="del" onclick="delGym(${e.id})">Delete</button></div><div style="margin-top:.3rem">${e.sets.map(s=>`<span class="chip">${s.weight} × ${s.reps}</span>`).join('')}</div></div>`;
    if(e.type==='walk')return walkCard(e);
    if(e.type==='body')return `<div class="hcard"><div class="t"><span>Body check-in</span></div><div style="margin-top:.3rem"><span class="chip">${e.weightLb} lb</span><span class="chip">${e.bodyFatPct}% fat</span></div></div>`;
    return `<div class="hcard"><div class="t"><span>Stretch routine</span><span class="chip done">${e.mode==='quick'?'quick':'complete'}</span></div></div>`;
  }).join('')).join(''):'<div class="muted">Your workouts will show up here.</div>');
}
function delGym(id){if(!confirm('Delete this entry?'))return;gymLog=gymLog.filter(e=>e.id!==id);LS.set('il4_gym',gymLog);renderHistory();}

// ───────── shell ─────────
function showPane(p){
  document.querySelectorAll('.pane').forEach(x=>x.classList.toggle('active',x.id==='pane-'+p));
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('active',b.dataset.p===p));
  ({workout:renderWorkout,stretch:renderStretch,walk:renderWalk,body:renderBody,history:renderHistory})[p]();
  window.scrollTo(0,0);
}
$('hdate').textContent=new Date().toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});
applyDisplay();
renderWorkout();
</script>
</body>
</html>
